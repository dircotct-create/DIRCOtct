<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - DIRCO Premium</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #00004d 0%, #1a0033 50%, #330066 100%);
            color: white;
            padding: 40px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .container {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
        }
        h1 { margin: 0 0 20px 0; }
        p { line-height: 1.6; margin: 10px 0; }
        .check { color: #4caf50; font-weight: bold; }
        .box {
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid #FF8C00;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/darkroomengineering/lenis@latest/bundled/lenis.js"></script>
</head>
<body>
    <div class="container">
        <h1>✨ DIRCO Premium - Status Check</h1>
        
        <div id="status" style="margin: 20px 0;"></div>
        
        <div class="box">
            <p><span class="check">✓</span> <strong>Archivos Implementados:</strong></p>
            <p>✓ gsap-setup.js</p>
            <p>✓ premium-effects.css</p>
            <p>✓ Librerías Externas</p>
        </div>
        
        <div class="box">
            <p><strong>Características Activas:</strong></p>
            <p>🎨 Glassmorphism</p>
            <p>🎯 3D Transforms</p>
            <p>📊 Parallax Multicapa</p>
            <p>✨ Microinteracciones</p>
            <p>🎬 Animaciones GSAP</p>
            <p>🔄 Lenis Smooth Scroll</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('status');
            const checks = [];
            
            // Check GSAP
            if (typeof gsap !== 'undefined') {
                checks.push('<p><span class="check">✓</span> GSAP cargado</p>');
            } else {
                checks.push('<p style="color: #f44336;">✗ GSAP NO cargado</p>');
            }
            
            // Check ScrollTrigger
            if (typeof ScrollTrigger !== 'undefined') {
                checks.push('<p><span class="check">✓</span> ScrollTrigger cargado</p>');
            } else {
                checks.push('<p style="color: #f44336;">✗ ScrollTrigger NO cargado</p>');
            }
            
            // Check Lenis
            if (typeof Lenis !== 'undefined') {
                checks.push('<p><span class="check">✓</span> Lenis cargado</p>');
            } else {
                checks.push('<p style="color: #f44336;">✗ Lenis NO cargado</p>');
            }
            
            statusDiv.innerHTML = '<h3>Librerías Detectadas:</h3>' + checks.join('');
            
            // Animación de prueba
            gsap.to('.box', {
                rotation: 360,
                duration: 20,
                repeat: -1,
                ease: 'none'
            });
        });
    </script>
</body>
</html>
